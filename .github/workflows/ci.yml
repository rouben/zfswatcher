name: CI

on:
  push:
    branches: [contrib, master]
  pull_request:
    branches: [contrib, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Existing findings are tolerated for now; only new ones fail the build.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          only-new-issues: true

      - name: Check formatting (gofmt, goimports)
        run: golangci-lint fmt --diff

      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test (race detector, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      # FreeBSD and Solaris are only kept compilable (no cgo here).
      - name: go vet (FreeBSD)
        run: GOOS=freebsd go vet ./...

      - name: go vet (Solaris)
        run: GOOS=solaris GOARCH=amd64 go vet ./...

      # The release workflow builds with the default PKGVERSION taken from
      # version.go; make sure that path works and reports the right version.
      - name: make with the release version
        run: |
          want=$(sed -n 's/^const VERSION = "\(.*\)"$/\1/p' version.go)
          make zfswatcher
          ./zfswatcher -v | tee /dev/stderr | grep -F "zfswatcher $want "
          rm -f zfswatcher

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
