name: Packages and pre-release

on:
  push:
    branches: [contrib]
  pull_request:
    branches: [contrib, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the pre-release

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pre-reqs
        run: sudo apt-get update && sudo apt-get install -y build-essential rpm dpkg-dev debhelper

      # Every build of this workflow is a development build with its own version,
      # e.g. 0.5.0+git20261122153012.a6cae3c. Pull requests get one too (same code
      # path); their sha is that of the merge commit checked out by Actions.
      - name: Compute development version
        run: |
          base=$(sed -n 's/^const VERSION = "\(.*\)"$/\1/p' version.go)
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
          sha=$(git rev-parse --short HEAD)
          echo "PKGVERSION=${base}+git${date}.${sha}" >> "$GITHUB_ENV"

      - name: Clean build environment
        run: make clean

      - name: Build ZFSWatcher
        run: make

      - name: Build Tarball
        run: make dist

      - name: Upload Tarball
        uses: actions/upload-artifact@v7
        with:
          name: ZFSWatcher Tarball
          path: '*.tar.*'

      # Prepend a changelog entry in this checkout only; nothing is committed.
      - name: Add development entry to debian/changelog
        run: |
          {
            echo "zfswatcher (${PKGVERSION}-1) UNRELEASED; urgency=medium"
            echo
            echo "  * Development build $(git rev-parse --short HEAD)."
            echo
            echo " -- tantefred <147740857+tantefred@users.noreply.github.com>  $(date -R -d "@$(git log -1 --format=%ct)")"
            echo
            cat debian/changelog
          } > "$RUNNER_TEMP/changelog"
          mv "$RUNNER_TEMP/changelog" debian/changelog
          head -n 6 debian/changelog

      - name: Build Debian package
        run: make deb

      # Errors fail the job; warnings and info are only shown. Check the
      # output of the first run and add debian/*.lintian-overrides if needed.
      - name: Lint Debian package (lintian)
        run: |
          sudo apt-get install -y lintian
          lintian --display-info --pedantic --fail-on error *.deb

      - name: Upload Debian package and changelog
        uses: actions/upload-artifact@v7
        with:
          name: ZFSWatcher DEB and Changelog
          path: |
            *.deb
            *.changes

      - name: Build RPM packages
        run: make rpm

      - name: Upload RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: ZFSWatcher RPMs
          path: '*.rpm'

      # Only publish from pushes to contrib, never from pull requests or master.
      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/contrib'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-dev --cleanup-tag --yes || true
          gh release create latest-dev --prerelease --draft \
            --target "$GITHUB_SHA" --title "Development Build $PKGVERSION" \
            --notes "Automatic development build $PKGVERSION of $GITHUB_SHA" \
            *.rpm *.deb
