name: ZFSWatcher Makefile CI

on:
  push:
    branches:
      - contrib
      - github-workflow
    tags:
      - '*'
  pull_request:
    branches:
      - contrib
      - github-workflow

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      
    - name: Clean build environment
      run: make clean
    - name: Build zfswatcher
      run: make
      
runs-on: self-hosted
