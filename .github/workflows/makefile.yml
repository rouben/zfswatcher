name: ZFSWatcher Makefile CI

on:
  push:
    branches:
      - contrib
      - github-workflow
    tags:
      - '*'
  pull_request:
    branches:
      - contrib
      - github-workflow

jobs:
  build:

    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2
      
    - name: Clean build environment
      run: make clean
    - name: Build zfswatcher
      run: make
