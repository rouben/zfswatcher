name: ZFSWatcher Makefile CI

on:
  push:
    branches:
      - contrib
      - github-workflow
    tags:
      - '*'
  pull_request:
    branches:
      - contrib
      - github-workflow

jobs:
  build:

    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2
      
    - name: Clean build environment
      run: make clean
    - name: Build zfswatcher
      run: make
    - name: Build tarball
      run: make dist
    - name: Build Debian package
      run: make deb
    - name: Build RPM packages
      run: make rpm
      
    - uses: actions/upload-artifact@v2
      with:
        name: Tarball
        path: *.tar.gz
        name: Debian package
        path: |
          *.deb
          *.changes
        name: RPM packages
        path: *.rpm
        
