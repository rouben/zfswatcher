name: Makefile CI

on:
  push:
    branches: [ contrib, github-workflow ]
  pull_request:
    branches: [ contrib, github-workflow ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      
    - name: Build zfswatcher
      run: make clean
      run: make
      
runs-on: self-hosted
