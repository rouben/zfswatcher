version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
  settings:
    gosec:
      excludes:
        # G204: zpool, zfs, ledctl and the notification commands are run on
        # purpose; their paths come from the admin-owned configuration.
        - G204

formatters:
  enable:
    - gofmt
    - goimports
